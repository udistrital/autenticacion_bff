appname = ${APP_NAME||autenticacion_bff}
httpport = ${APP_PORT||8000}
runmode = ${RUNMODE||prod}
debug = ${DEBUG||false}

keycloak_base_url = ${KEYCLOAK_BASE_URL}
keycloak_realm = ${KEYCLOAK_REALM}
keycloak_client_id = ${KEYCLOAK_CLIENT_ID}
keycloak_client_secret = ${KEYCLOAK_CLIENT_SECRET}
keycloak_redirect_uri = ${KEYCLOAK_REDIRECT_URI}

session_cookie_name = id_sesion
session_cookie_secure = false
session_cookie_samesite = Lax

frontend_success_redirect = ${FRONTEND_SUCCESS_REDIRECT}
frontend_logout_redirect = ${FRONTEND_LOGOUT_REDIRECT}

dynamodb_table_sesiones = ${DYNAMODB}
dynamodb_endpoint_url = ${DYNAMODB_URL}
aws_region = ${AWS_REGION}
aws_access_key_id = ${AWS_ACCESS_KEY_ID}
aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
