appname = ${APP_NAME||autenticacion_bff}
httpport = ${APP_PORT||8000}
runmode = ${RUNMODE||prod}
debug = ${DEBUG||false}

# Configuración global de Keycloak
keycloak_base_url = ${KEYCLOAK_BASE_URL}
keycloak_realm = ${KEYCLOAK_REALM}
keycloak_default_scope = ${KEYCLOAK_DEFAULT_SCOPE||openid profile email}

# Configuración de PostgreSQL para clientes
postgres_host = ${POSTGRES_HOST}
postgres_port = ${POSTGRES_PORT||5432}
postgres_db = ${POSTGRES_DB}
postgres_user = ${POSTGRES_USER}
postgres_password = ${POSTGRES_PASSWORD}
postgres_sslmode = ${POSTGRES_SSLMODE||disable}
postgres_schema = ${POSTGRES_SCHEMA||configuracion}

# Cookies de sesión del BFF
session_cookie_name = ${SESSION_COOKIE_NAME||id_sesion}
session_cookie_secure = ${SESSION_COOKIE_SECURE||false}
session_cookie_samesite = ${SESSION_COOKIE_SAMESITE||Lax}
session_cookie_path = ${SESSION_COOKIE_PATH||/}

# Cookie temporal para contexto de login
login_context_cookie_name = ${LOGIN_CONTEXT_COOKIE_NAME||kc_login_ctx}
login_context_cookie_secure = ${LOGIN_CONTEXT_COOKIE_SECURE||false}
login_context_cookie_samesite = ${LOGIN_CONTEXT_COOKIE_SAMESITE||Lax}
login_context_cookie_path = ${LOGIN_CONTEXT_COOKIE_PATH||/}
login_context_signing_key = ${LOGIN_CONTEXT_SIGNING_KEY}

# DynamoDB para sesiones
dynamodb_table_sesiones = ${DYNAMODB}
dynamodb_endpoint_url = ${DYNAMODB_URL}
aws_region = ${AWS_REGION}
aws_access_key_id = ${AWS_ACCESS_KEY_ID}
aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
